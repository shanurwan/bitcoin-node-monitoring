        - record: node:electrs_slo_requests:rate6h
          expr: "sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[6h]))"
          labels:
            slo: electrum-latency
        - record: node:electrs_slo_errors:ratio_rate6h
          expr: "1 - (sum by (node) (rate(electrum_rpc_bucket{job=\"electrs\", le=\"2.5\"}[6h]))) / (sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[6h])))"
          labels:
