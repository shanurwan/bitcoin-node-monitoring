# Alerting and recording rules (prometheus-operator PrometheusRule) and the Grafana
# dashboard as a ConfigMap labelled for the Grafana dashboard sidecar.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheusrule.yaml
configMapGenerator:
  - name: bitcoin-node-dashboard
    files:
      - bitcoin-node-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
