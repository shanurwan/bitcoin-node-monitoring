# Both monitors set job, and take node from the pod label bitcoin-node, so one pair of
# monitors covers every bitcoind + electrs pair. Label the bitcoind exporter pod and the
# electrs pod of one pair with the same value, for example bitcoin-node: mainnet-1.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bitcoind
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bitcoind-exporter
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - targetLabel: job
          replacement: bitcoind
        - sourceLabels: [__meta_kubernetes_pod_label_bitcoin_node]
          targetLabel: node
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: electrs
spec:
  # electrs releases up to now serve /metrics without a Content-Type header, and
  # Prometheus 3 needs a fallback protocol to scrape them (prometheus-operator >= v0.79).
  fallbackScrapeProtocol: PrometheusText0.0.4
  selector:
    matchLabels:
      app.kubernetes.io/name: electrs     # the label on your electrs Service
  endpoints:
    - port: monitoring                    # the Service port for --monitoring-addr
      interval: 30s
      relabelings:
        - targetLabel: job
          replacement: electrs
        - sourceLabels: [__meta_kubernetes_pod_label_bitcoin_node]
          targetLabel: node
