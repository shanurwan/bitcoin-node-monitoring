apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitcoind-exporter
  labels:
    app.kubernetes.io/name: bitcoind-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bitcoind-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitcoind-exporter
        bitcoin-node: mainnet-1   # the node label in Prometheus; same value on this pair's electrs pod
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: python:3.13-alpine@sha256:9ef1a599f863231c3d91e941389bfdc4a2d6070557243d54df1a4e57015b960e
          command: ["python3", "-I", "/app/bitcoind_exporter.py"]
          env:
            - name: BITCOIND_RPC_URL
              value: http://bitcoind:8332/
            # Use a dedicated read-only RPC user; see the exporter's docstring for
            # the -rpcauth / -rpcwhitelist lines.
            - name: BITCOIND_RPC_USER
              valueFrom:
                secretKeyRef: {name: bitcoind-rpc, key: user}
            - name: BITCOIND_RPC_PASSWORD
              valueFrom:
                secretKeyRef: {name: bitcoind-rpc, key: password}
            - name: EXPORTER_LISTEN
              value: 0.0.0.0:9332
          ports:
            - name: metrics
              containerPort: 9332
          readinessProbe:
            tcpSocket: {port: metrics}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: bitcoind-exporter
