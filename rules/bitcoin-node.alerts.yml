# Alerts for one or more bitcoind + electrs pairs. Severity "critical" is meant to
# page; "warning" is meant for a ticket or a chat channel during working hours.
# Every alert links to a runbook in runbooks/.
#
# A target that disappears (pod Pending, StatefulSet scaled to 0, a ServiceMonitor
# that no longer matches) has no up series at all, so up == 0 never fires for it.
# The Down alerts therefore also fire when a job has no targets, or when one half
# of a bitcoind + electrs pair is scraped and the other is missing.
groups:
  - name: bitcoind.alerts
    rules:
      - alert: BitcoindDown
        # Warmup (RPC error -28) has its own alert below with a longer for:.
        expr: |
          (bitcoind_up{job="bitcoind"} == 0 unless on (instance) bitcoind_rpc_warmup{job="bitcoind"} == 1)
            or up{job="bitcoind"} == 0
            or (group by (node) (up{job="electrs"}) unless on (node) group by (node) (up{job="bitcoind"}))
            # No bitcoind target anywhere. When electrs is scraped, the line above already
            # names each node; firing here too paged twice for one fault in the game day.
            or (absent(up{job="bitcoind"}) unless on () group(up{job="electrs"}))
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'bitcoind on {{ or $labels.node "every node" }} is not answering RPC'
          description: "For 5 minutes bitcoind's JSON-RPC has not answered, or its exporter is not scraped or has no target at all. electrs on this node cannot index new blocks or relay transactions."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoind-down.md

      - alert: BitcoindWarmupTooLong
        # Loading the block index and verifying the last blocks takes minutes. Replaying
        # blocks after an unclean shutdown can take much longer; the node serves nothing
        # meanwhile, and electrs waits on it (see ElectrsMainLoopStalled).
        expr: bitcoind_rpc_warmup{job="bitcoind"} == 1
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "bitcoind on {{ $labels.node }} has been starting up for 30 minutes"
          description: "bitcoind has answered every RPC call with 'in warmup' (error -28) for 30 minutes: it is still loading the block index, verifying blocks or replaying blocks after an unclean shutdown."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoind-down.md#still-warming-up

      - alert: BitcoindNoPeers
        expr: sum by (node) (bitcoind_peers{job="bitcoind"}) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "bitcoind on {{ $labels.node }} has no peers"
          description: "bitcoind has had zero P2P connections for 10 minutes. It will not see new blocks or transactions."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoind-no-peers.md

      - alert: BitcoindLowOutboundPeers
        expr: sum by (node) (bitcoind_peers{job="bitcoind", direction="out"}) < 4
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "bitcoind on {{ $labels.node }} has {{ $value }} outbound peers"
          description: "bitcoind normally keeps 10 outbound connections (8 full-relay, 2 block-relay-only). Fewer than 4 for 30 minutes makes the node easier to isolate and slower to hear about blocks."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoind-low-outbound-peers.md

      - alert: BitcoindNoNewBlocks
        # Mainnet: no block for 95 minutes has probability e^-9.5 (about 1 in 13,000)
        # per block interval, which happens about 4 times a year, on every node at once.
        # So this is a warning; BitcoindBehindFleet is the page.
        # Block timestamps can be off by up to two hours, so this uses the height.
        # "x - x offset 90m" returns nothing until there is a sample from 90 minutes ago,
        # so a Prometheus restart or a new target does not fire it (changes() would).
        expr: (bitcoind_blocks{job="bitcoind"} - bitcoind_blocks{job="bitcoind"} offset 90m) == 0 and bitcoind_initial_block_download{job="bitcoind"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "bitcoind on {{ $labels.node }} has not seen a new block for 95 minutes"
          description: "bitcoind's height has not changed for 95 minutes. Either the node is stuck or partitioned, or the network really is slow; compare with another source before acting."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoind-no-new-blocks.md

      - alert: BitcoindBehindFleet
        # Needs two or more nodes. A slow network moves every node together; a stuck or
        # partitioned node falls behind the others.
        expr: |
          (
            max by (node) (bitcoind_blocks{job="bitcoind"})
              < on () group_left () (max (bitcoind_blocks{job="bitcoind"}) - 2)
          )
          unless on (node) max by (node) (bitcoind_initial_block_download{job="bitcoind"}) == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "bitcoind on {{ $labels.node }} is behind the other nodes"
          description: "bitcoind on {{ $labels.node }} has been more than 2 blocks behind the highest node for 10 minutes. The other nodes see new blocks, so this one is stuck or cut off."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoind-no-new-blocks.md

      - alert: BitcoindRejectedChainAhead
        # The node marked a block invalid that is higher than its own tip: either it rejects a
        # chain the network accepts (March 2013, BIP 50) or a miner extends an invalid chain
        # (July 2015, BIP 66). Both need a human. Neither moves headers past blocks, because
        # bitcoind drops headers that build on an invalid block, so BlocksBehindHeaders stays quiet.
        expr: bitcoind_invalid_tip_height{job="bitcoind"} > bitcoind_blocks{job="bitcoind"}
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "bitcoind on {{ $labels.node }} rejected a chain that is ahead of its own"
          description: "bitcoind on {{ $labels.node }} has marked a block at height {{ $value }} invalid, above its own tip, for 10 minutes. Either this node rejects blocks the network accepts, or part of the network is mining an invalid chain."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoind-rejected-chain-ahead.md

      - alert: BitcoindBlocksBehindHeaders
        expr: (bitcoind_headers{job="bitcoind"} - bitcoind_blocks{job="bitcoind"}) > 2 and bitcoind_initial_block_download{job="bitcoind"} == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "bitcoind on {{ $labels.node }} is {{ $value }} blocks behind its headers"
          description: "bitcoind knows about headers it has not validated for 30 minutes: block download or validation is stuck (slow disk, no peers serving blocks, or a block that fails validation)."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoind-blocks-behind-headers.md

      - alert: BitcoindInitialBlockDownloadStalled
        expr: bitcoind_initial_block_download{job="bitcoind"} == 1 and (bitcoind_blocks{job="bitcoind"} - bitcoind_blocks{job="bitcoind"} offset 30m) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "bitcoind initial block download on {{ $labels.node }} is not progressing"
          description: "bitcoind is in initial block download and its height has not changed for 45 minutes."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoind-initial-block-download-stalled.md

      - alert: BitcoindRestartLoop
        expr: resets(bitcoind_uptime_seconds{job="bitcoind"}[1h]) >= 3
        for: 0m
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "bitcoind on {{ $labels.node }} restarted {{ $value }} times in an hour"
          description: "bitcoind's uptime went back to zero at least 3 times in the last hour."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoind-restart-loop.md

      - alert: BitcoindWarnings
        expr: bitcoind_warnings{job="bitcoind"} > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "bitcoind on {{ $labels.node }} reports {{ $value }} warning(s)"
          description: "getblockchaininfo returns warnings, for example unknown new consensus rules activated, a clock out of sync with peers, or a pre-release build."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoind-warnings.md

  - name: electrs.alerts
    rules:
      - alert: ElectrsDown
        expr: |
          up{job="electrs"} == 0
            or (group by (node) (up{job="bitcoind"}) unless on (node) group by (node) (up{job="electrs"}))
            or (absent(up{job="electrs"}) unless on () group(up{job="bitcoind"}))
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'electrs on {{ or $labels.node "every node" }} is down'
          description: "For 5 minutes Prometheus has not scraped electrs, or has no electrs target at all. The monitoring endpoint starts before indexing, so this means the process is not running, not reachable, or not scheduled."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-down.md

      - alert: ElectrsIndexBehind
        expr: node:electrs_index_lag_blocks > 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "electrs on {{ $labels.node }} is {{ $value }} blocks behind bitcoind"
          description: "electrs has finished its initial sync but has been more than 3 blocks behind bitcoind for 10 minutes. Clients see stale balances and confirmations."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-index-behind.md

      - alert: ElectrsInitialSyncStalled
        # tip_height stays 0 until the initial sync (including its one-time full
        # compaction) completes. Compaction can run for hours on mainnet without moving
        # initial_sync_height, so it does not count as a stall.
        expr: |
          max by (node) (tip_height{job="electrs"}) == 0
            and on (node) max by (node) (initial_sync_height{job="electrs"} - initial_sync_height{job="electrs"} offset 30m) == 0
            and on (node) node:electrs_rocksdb_running_compactions:sum == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "electrs initial sync on {{ $labels.node }} is not progressing"
          description: "electrs has not finished its initial sync, no block batch has completed for 45 minutes, and RocksDB is not compacting."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-initial-sync-stalled.md

      - alert: ElectrsMainLoopStalled
        # electrs_main_loop_count exists only after startup and goes up every 5 s.
        # electrs retries forever while bitcoind is unreachable or warming up, which
        # stops the loop; BitcoindDown or BitcoindWarmupTooLong cover that case.
        expr: |
          (electrs_main_loop_count{job="electrs"} - electrs_main_loop_count{job="electrs"} offset 10m) == 0
            unless on (node) max by (node) (bitcoind_up{job="bitcoind"}) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "electrs main loop on {{ $labels.node }} is stuck"
          description: "The main loop, which indexes new blocks and syncs the mempool every 5 seconds, has not run for 15 minutes while the process is still being scraped."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-main-loop-stalled.md

      - alert: ElectrsStaleCleanupFailing
        expr: stale_cleanup_failing{job="electrs"} == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "electrs on {{ $labels.node }} cannot clean up after a reorg"
          description: "electrs reports that stale block history cleanup is failing, and indexing cannot advance until it succeeds."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-stale-cleanup-failing.md

      - alert: ElectrsRocksDBWriteStopped
        expr: max by (node, db) (rocksdb_is_write_stopped{job="electrs"}) == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "RocksDB {{ $labels.db }} writes are stopped on {{ $labels.node }}"
          description: "RocksDB has stopped writes to {{ $labels.db }} for 5 minutes, usually because compaction cannot keep up or the disk is full."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-rocksdb-write-stopped.md

      - alert: ElectrsRocksDBWriteDelayed
        # RocksDB slows writes before it stops them. Not checked during the initial sync.
        expr: |
          max by (node, db) (rocksdb_actual_delayed_write_rate{job="electrs"}) > 0
            and on (node) node:electrs_tip_height:max > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "RocksDB {{ $labels.db }} writes are being delayed on {{ $labels.node }}"
          description: "RocksDB has throttled writes to {{ $labels.db }} for 15 minutes because compaction is falling behind. If it continues, writes stop (ElectrsRocksDBWriteStopped)."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-rocksdb-write-stopped.md

      - alert: ElectrsRocksDBBackgroundErrors
        expr: increase(rocksdb_background_errors_total{job="electrs"}[15m]) > 0
        for: 0m
        keep_firing_for: 10m
        labels:
          severity: critical
        annotations:
          summary: "RocksDB {{ $labels.db }} on {{ $labels.node }} hit background errors"
          description: "A flush or compaction in {{ $labels.db }} failed. RocksDB may switch the database to read-only."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-rocksdb-background-errors.md

      - alert: ElectrsBitcoindRPCErrors
        # daemon_rpc_proxied{result="error"} is left out on purpose: it counts bitcoind
        # rejecting a client's transaction (invalid, double spend, fee too low), which is
        # normal traffic on a public Esplora.
        expr: |
          (
            sum by (node) (increase(daemon_rpc_conn_handshake{job="electrs", result=~"rejected|timeout|error"}[15m])) > 3
              or
            sum by (node) (increase(daemon_rpc_proxied{job="electrs", result=~"busy|unavailable"}[15m])) > 10
          )
          unless on (node) max by (node) (bitcoind_up{job="bitcoind"}) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "electrs on {{ $labels.node }} is failing to talk to bitcoind"
          description: "electrs's RPC connections to bitcoind are being refused, rejected or not answered, or proxied client calls find no free slot or no answer. Common causes are bitcoind's -rpcmaxconnections and -rpcthreads limits and electrs's --daemon-parallelism."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-bitcoind-rpc-errors.md

      - alert: ElectrsBitcoindRPCSlow
        # getblock is excluded: it moves whole blocks and is slow by nature during sync.
        expr: |
          histogram_quantile(0.99, sum by (node, le) (rate(daemon_rpc_bucket{job="electrs", method!="getblock"}[10m]))) > 2.5
            and on (node) node:electrs_tip_height:max > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "bitcoind RPC p99 latency on {{ $labels.node }} is {{ $value | humanizeDuration }}"
          description: "The 99th percentile of electrs's RPC calls to bitcoind (excluding getblock) has been above 2.5 s for 15 minutes."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-bitcoind-rpc-slow.md

      - alert: ElectrsMempoolSyncFailing
        expr: increase(mempool_sync_failed_to_index{job="electrs"}[30m]) > 2
        for: 0m
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "electrs mempool sync on {{ $labels.node }} keeps failing"
          description: "electrs failed to index fetched mempool transactions more than twice in 30 minutes. Unconfirmed history and fee data may be incomplete."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-mempool-sync-failing.md

      - alert: ElectrsElectrumFdLimit
        # electrs creates the fd_limit series on the first refusal, and increase() cannot
        # see the step from "no series" to 1. The second half catches a series that did not
        # exist 10 minutes ago. After a Prometheus restart it can fire once for refusals
        # earlier in electrs's lifetime.
        expr: |
          increase(electrum_connection_errors_total{job="electrs", reason="fd_limit"}[10m]) > 0
            or (electrum_connection_errors_total{job="electrs", reason="fd_limit"} > 0
                unless electrum_connection_errors_total{job="electrs", reason="fd_limit"} offset 10m)
        for: 0m
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "electrs on {{ $labels.node }} is refusing Electrum connections at its file descriptor limit"
          description: "electrs refused {{ $value | humanize }} Electrum connections in 10 minutes because it is close to its open-file limit."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-electrum-fd-limit.md

      - alert: ElectrsRestartLoop
        expr: resets(process_cpu_usage{job="electrs", type="utime"}[1h]) >= 3
        for: 0m
        keep_firing_for: 10m
        labels:
          severity: warning
        annotations:
          summary: "electrs on {{ $labels.node }} restarted {{ $value }} times in an hour"
          description: "electrs's CPU time counter went back to zero at least 3 times in the last hour, so the process keeps restarting."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-restart-loop.md

      - alert: ElectrsMemoryHigh
        expr: process_memory_rss{job="electrs"} > on () group_left () (0.85 * bitcoin_node:electrs_memory_budget_bytes)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "electrs on {{ $labels.node }} uses {{ $value | humanize1024 }}B, over 85% of its memory budget"
          description: "electrs's resident memory has been above 85% of bitcoin_node:electrs_memory_budget_bytes for 10 minutes. Initial sync and the full compaction after it are the peaks; an OOM kill there restarts a long job."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-memory-high.md

      - alert: ElectrsContainerMemoryHigh
        # Kubernetes: the working set against the container limit, which is what the OOM
        # killer acts on. Assumes the container is named electrs.
        expr: |
          max by (namespace, pod) (container_memory_working_set_bytes{container="electrs"})
            / max by (namespace, pod) (kube_pod_container_resource_limits{container="electrs", resource="memory"})
            > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "electrs in {{ $labels.namespace }}/{{ $labels.pod }} uses {{ $value | humanizePercentage }} of its memory limit"
          description: "The electrs container's working set has been above 85% of its memory limit for 10 minutes. Initial sync and the full compaction after it are the peaks; an OOM kill there restarts a long job."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-memory-high.md

  - name: bitcoin-node-host.alerts
    rules:
      - alert: BitcoinNodeOOMKilled
        # A process killed for memory within seconds of starting never answers a scrape, so
        # ElectrsMemoryHigh and ElectrsRestartLoop have no data to fire on. In the game day an
        # electrs OOM loop (31 kills in 8 minutes) was seen only by ElectrsDown, after 6 minutes.
        # The kernel's counter, or the container's last exit reason, gives the cause at once.
        expr: |
          increase(node_vmstat_oom_kill{job="node"}[5m]) > 0
            or (
              sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total{container=~"bitcoind|electrs"}[5m])) > 0
                and on (namespace, pod, container)
              max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{container=~"bitcoind|electrs", reason="OOMKilled"}) == 1
            )
        for: 0m
        keep_firing_for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'A process on {{ or $labels.node $labels.pod }} was killed for using too much memory'
          description: "The kernel killed a process for memory in the last 5 minutes (node_vmstat_oom_kill), or a bitcoind or electrs container restarted after an OOMKilled exit. If ElectrsDown or BitcoindDown is firing too, this is the cause."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-memory-high.md#oom-kills

      - alert: BitcoinNodeDiskWillFill
        expr: |
          predict_linear(node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|ramfs|overlay|squashfs"}[6h], 48 * 3600) < 0
            and (node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|ramfs|overlay|squashfs"} / node_filesystem_size_bytes{job="node", fstype!~"tmpfs|ramfs|overlay|squashfs"}) < 0.25
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.node }} will fill within 48 hours"
          description: "At the growth rate of the last 6 hours, {{ $labels.mountpoint }} runs out of space within 48 hours, and it is already more than 75% full."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoin-node-disk.md

      - alert: BitcoinNodeDiskAlmostFull
        expr: |
          (node_filesystem_avail_bytes{job="node", fstype!~"tmpfs|ramfs|overlay|squashfs"} / node_filesystem_size_bytes{job="node", fstype!~"tmpfs|ramfs|overlay|squashfs"}) < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.node }} is {{ $value | humanizePercentage }} free"
          description: "Less than 5% of {{ $labels.mountpoint }} is free. bitcoind shuts down when it cannot write, and RocksDB stops writes."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoin-node-disk.md

  - name: bitcoin-node-volumes.alerts
    rules:
      # Kubernetes: the disk alerts again, from kubelet volume stats, for
      # PersistentVolumeClaims whose name contains bitcoin or electrs. Change the regex
      # to match your claims.
      - alert: BitcoinNodeVolumeWillFill
        expr: |
          predict_linear(kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".*(bitcoin|electrs).*"}[6h], 48 * 3600) < 0
            and (kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".*(bitcoin|electrs).*"} / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".*(bitcoin|electrs).*"}) < 0.25
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} will fill within 48 hours"
          description: "At the growth rate of the last 6 hours, {{ $labels.persistentvolumeclaim }} runs out of space within 48 hours, and it is already more than 75% full."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoin-node-disk.md

      - alert: BitcoinNodeVolumeAlmostFull
        expr: |
          (kubelet_volume_stats_available_bytes{persistentvolumeclaim=~".*(bitcoin|electrs).*"} / kubelet_volume_stats_capacity_bytes{persistentvolumeclaim=~".*(bitcoin|electrs).*"}) < 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} free"
          description: "Less than 5% of {{ $labels.persistentvolumeclaim }} is free. bitcoind shuts down when it cannot write, and RocksDB stops writes."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/bitcoin-node-disk.md
