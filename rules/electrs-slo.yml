# Generated by scripts/generate.py. Edit SLOS there, not this file.
#
# Multi-window, multi-burn-rate alerts. Each SLO records, with an slo label:
#   node:electrs_slo_requests:rate5m       requests per second over 5 minutes
#   node:electrs_slo_errors:rate5m         bad requests per second over 5 minutes
#   node:electrs_slo_errors:ratio_rate<W>  fraction of requests that were bad, for the
#                                          windows 5m, 30m, 1h, 2h, 6h, 1d, 3d
#   node:electrs_slo_requests:rate<W>      requests per second, for 1h, 1d
# Windows longer than 5m are computed from the recorded 5m rates (summed bad rate over
# summed total rate), so only the 5m rules read the raw histograms. Recording the bad
# rate rather than the good one means a series that starts mid-window (a new
# deployment of these rules, a new node) under-counts errors instead of inventing them.
groups:
  - name: electrs-slo.rules
    rules:
      - record: node:electrs_rest_requests:rate5m
        expr: "sum by (node) (rate(rest_request_duration_seconds_count{job=\"electrs\"}[5m]))"
      - record: node:electrs_slo_requests:rate5m
        expr: "node:electrs_rest_requests:rate5m"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_errors:rate5m
        expr: "(node:electrs_rest_requests:rate5m) - (sum by (node) (rate(rest_request_duration_seconds_count{job=\"electrs\", status!~\"5..\"}[5m])))"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_requests:rate5m
        expr: "node:electrs_rest_requests:rate5m"
        labels:
          slo: rest-latency
      - record: node:electrs_slo_errors:rate5m
        expr: "(node:electrs_rest_requests:rate5m) - (sum by (node) (rate(rest_request_duration_seconds_bucket{job=\"electrs\", le=~\"1|1\\\\.0\"}[5m])))"
        labels:
          slo: rest-latency
      - record: node:electrs_slo_requests:rate5m
        expr: "sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[5m]))"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_errors:rate5m
        expr: "(sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[5m]))) - (sum by (node) (rate(electrum_rpc_bucket{job=\"electrs\", le=\"2.5\"}[5m])))"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_errors:ratio_rate5m
        expr: "node:electrs_slo_errors:rate5m{slo=\"rest-availability\"} / node:electrs_slo_requests:rate5m{slo=\"rest-availability\"}"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_errors:ratio_rate30m
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"rest-availability\"}[30m]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-availability\"}[30m])"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_errors:ratio_rate1h
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"rest-availability\"}[1h]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-availability\"}[1h])"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_errors:ratio_rate2h
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"rest-availability\"}[2h]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-availability\"}[2h])"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_errors:ratio_rate6h
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"rest-availability\"}[6h]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-availability\"}[6h])"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_errors:ratio_rate1d
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"rest-availability\"}[1d]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-availability\"}[1d])"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_errors:ratio_rate3d
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"rest-availability\"}[3d]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-availability\"}[3d])"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_requests:rate1h
        expr: "avg_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-availability\"}[1h])"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_requests:rate1d
        expr: "avg_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-availability\"}[1d])"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_errors:ratio_rate5m
        expr: "node:electrs_slo_errors:rate5m{slo=\"rest-latency\"} / node:electrs_slo_requests:rate5m{slo=\"rest-latency\"}"
        labels:
          slo: rest-latency
      - record: node:electrs_slo_errors:ratio_rate30m
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"rest-latency\"}[30m]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-latency\"}[30m])"
        labels:
          slo: rest-latency
      - record: node:electrs_slo_errors:ratio_rate1h
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"rest-latency\"}[1h]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-latency\"}[1h])"
        labels:
          slo: rest-latency
      - record: node:electrs_slo_errors:ratio_rate2h
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"rest-latency\"}[2h]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-latency\"}[2h])"
        labels:
          slo: rest-latency
      - record: node:electrs_slo_errors:ratio_rate6h
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"rest-latency\"}[6h]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-latency\"}[6h])"
        labels:
          slo: rest-latency
      - record: node:electrs_slo_errors:ratio_rate1d
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"rest-latency\"}[1d]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-latency\"}[1d])"
        labels:
          slo: rest-latency
      - record: node:electrs_slo_errors:ratio_rate3d
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"rest-latency\"}[3d]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-latency\"}[3d])"
        labels:
          slo: rest-latency
      - record: node:electrs_slo_requests:rate1h
        expr: "avg_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-latency\"}[1h])"
        labels:
          slo: rest-latency
      - record: node:electrs_slo_requests:rate1d
        expr: "avg_over_time(node:electrs_slo_requests:rate5m{slo=\"rest-latency\"}[1d])"
        labels:
          slo: rest-latency
      - record: node:electrs_slo_errors:ratio_rate5m
        expr: "node:electrs_slo_errors:rate5m{slo=\"electrum-latency\"} / node:electrs_slo_requests:rate5m{slo=\"electrum-latency\"}"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_errors:ratio_rate30m
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"electrum-latency\"}[30m]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"electrum-latency\"}[30m])"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_errors:ratio_rate1h
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"electrum-latency\"}[1h]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"electrum-latency\"}[1h])"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_errors:ratio_rate2h
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"electrum-latency\"}[2h]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"electrum-latency\"}[2h])"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_errors:ratio_rate6h
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"electrum-latency\"}[6h]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"electrum-latency\"}[6h])"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_errors:ratio_rate1d
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"electrum-latency\"}[1d]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"electrum-latency\"}[1d])"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_errors:ratio_rate3d
        expr: "sum_over_time(node:electrs_slo_errors:rate5m{slo=\"electrum-latency\"}[3d]) / sum_over_time(node:electrs_slo_requests:rate5m{slo=\"electrum-latency\"}[3d])"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_requests:rate1h
        expr: "avg_over_time(node:electrs_slo_requests:rate5m{slo=\"electrum-latency\"}[1h])"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_requests:rate1d
        expr: "avg_over_time(node:electrs_slo_requests:rate5m{slo=\"electrum-latency\"}[1d])"
        labels:
          slo: electrum-latency

  - name: electrs-slo.alerts
    rules:
      - alert: ElectrsRESTAvailabilityBurnFast
        expr: "((node:electrs_slo_errors:ratio_rate1h{slo=\"rest-availability\"} > (14.4 * 0.005) and node:electrs_slo_errors:ratio_rate5m{slo=\"rest-availability\"} > (14.4 * 0.005)) or (node:electrs_slo_errors:ratio_rate6h{slo=\"rest-availability\"} > (6 * 0.005) and node:electrs_slo_errors:ratio_rate30m{slo=\"rest-availability\"} > (6 * 0.005))) and on (node) node:electrs_slo_requests:rate1h{slo=\"rest-availability\"} > (1 / 60)"
        for: 2m
        labels:
          severity: critical
          slo: rest-availability
        annotations:
          summary: "electrs rest-availability SLO on {{ $labels.node }} is burning its error budget (fast)"
          description: "Objective: 99.5% of REST requests that did not return a 5xx status over 30 days. At the current rate the error budget would be gone within 2 to 5 days."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-rest-availability-slo.md
      - alert: ElectrsRESTAvailabilityBurnSlow
        expr: "((node:electrs_slo_errors:ratio_rate1d{slo=\"rest-availability\"} > (3 * 0.005) and node:electrs_slo_errors:ratio_rate2h{slo=\"rest-availability\"} > (3 * 0.005)) or (node:electrs_slo_errors:ratio_rate3d{slo=\"rest-availability\"} > (1 * 0.005) and node:electrs_slo_errors:ratio_rate6h{slo=\"rest-availability\"} > (1 * 0.005))) and on (node) node:electrs_slo_requests:rate1d{slo=\"rest-availability\"} > (1 / 60)"
        for: 15m
        labels:
          severity: warning
          slo: rest-availability
        annotations:
          summary: "electrs rest-availability SLO on {{ $labels.node }} is burning its error budget (slow)"
          description: "Objective: 99.5% of REST requests that did not return a 5xx status over 30 days. At the current rate the error budget would be gone within 10 to 30 days."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-rest-availability-slo.md
      - alert: ElectrsRESTLatencyBurnFast
        expr: "((node:electrs_slo_errors:ratio_rate1h{slo=\"rest-latency\"} > (14.4 * 0.01) and node:electrs_slo_errors:ratio_rate5m{slo=\"rest-latency\"} > (14.4 * 0.01)) or (node:electrs_slo_errors:ratio_rate6h{slo=\"rest-latency\"} > (6 * 0.01) and node:electrs_slo_errors:ratio_rate30m{slo=\"rest-latency\"} > (6 * 0.01))) and on (node) node:electrs_slo_requests:rate1h{slo=\"rest-latency\"} > (1 / 60)"
        for: 2m
        labels:
          severity: critical
          slo: rest-latency
        annotations:
          summary: "electrs rest-latency SLO on {{ $labels.node }} is burning its error budget (fast)"
          description: "Objective: 99% of REST requests served within 1 s over 30 days. At the current rate the error budget would be gone within 2 to 5 days."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-rest-latency-slo.md
      - alert: ElectrsRESTLatencyBurnSlow
        expr: "((node:electrs_slo_errors:ratio_rate1d{slo=\"rest-latency\"} > (3 * 0.01) and node:electrs_slo_errors:ratio_rate2h{slo=\"rest-latency\"} > (3 * 0.01)) or (node:electrs_slo_errors:ratio_rate3d{slo=\"rest-latency\"} > (1 * 0.01) and node:electrs_slo_errors:ratio_rate6h{slo=\"rest-latency\"} > (1 * 0.01))) and on (node) node:electrs_slo_requests:rate1d{slo=\"rest-latency\"} > (1 / 60)"
        for: 15m
        labels:
          severity: warning
          slo: rest-latency
        annotations:
          summary: "electrs rest-latency SLO on {{ $labels.node }} is burning its error budget (slow)"
          description: "Objective: 99% of REST requests served within 1 s over 30 days. At the current rate the error budget would be gone within 10 to 30 days."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-rest-latency-slo.md
      - alert: ElectrsElectrumLatencyBurnFast
        expr: "((node:electrs_slo_errors:ratio_rate1h{slo=\"electrum-latency\"} > (14.4 * 0.01) and node:electrs_slo_errors:ratio_rate5m{slo=\"electrum-latency\"} > (14.4 * 0.01)) or (node:electrs_slo_errors:ratio_rate6h{slo=\"electrum-latency\"} > (6 * 0.01) and node:electrs_slo_errors:ratio_rate30m{slo=\"electrum-latency\"} > (6 * 0.01))) and on (node) node:electrs_slo_requests:rate1h{slo=\"electrum-latency\"} > (1 / 60)"
        for: 2m
        labels:
          severity: critical
          slo: electrum-latency
        annotations:
          summary: "electrs electrum-latency SLO on {{ $labels.node }} is burning its error budget (fast)"
          description: "Objective: 99% of Electrum RPC calls served within 2.5 s over 30 days. At the current rate the error budget would be gone within 2 to 5 days."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-electrum-latency-slo.md
      - alert: ElectrsElectrumLatencyBurnSlow
        expr: "((node:electrs_slo_errors:ratio_rate1d{slo=\"electrum-latency\"} > (3 * 0.01) and node:electrs_slo_errors:ratio_rate2h{slo=\"electrum-latency\"} > (3 * 0.01)) or (node:electrs_slo_errors:ratio_rate3d{slo=\"electrum-latency\"} > (1 * 0.01) and node:electrs_slo_errors:ratio_rate6h{slo=\"electrum-latency\"} > (1 * 0.01))) and on (node) node:electrs_slo_requests:rate1d{slo=\"electrum-latency\"} > (1 / 60)"
        for: 15m
        labels:
          severity: warning
          slo: electrum-latency
        annotations:
          summary: "electrs electrum-latency SLO on {{ $labels.node }} is burning its error budget (slow)"
          description: "Objective: 99% of Electrum RPC calls served within 2.5 s over 30 days. At the current rate the error budget would be gone within 10 to 30 days."
          runbook_url: https://github.com/shanurwan/bitcoin-node-monitoring/blob/main/runbooks/electrs-electrum-latency-slo.md
