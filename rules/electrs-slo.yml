      - record: node:electrs_slo_errors:ratio_rate3d
        expr: "1 - (sum by (node) (rate(rest_request_duration_seconds_bucket{job=\"electrs\", le=~\"1|1\\\\.0\"}[3d]))) / (sum by (node) (rate(rest_request_duration_seconds_count{job=\"electrs\"}[3d])))"
        labels:
          slo: rest-latency
      - record: node:electrs_slo_requests:rate5m
        expr: "sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[5m]))"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_errors:ratio_rate5m
        expr: "1 - (sum by (node) (rate(electrum_rpc_bucket{job=\"electrs\", le=\"2.5\"}[5m]))) / (sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[5m])))"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_requests:rate30m
        expr: "sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[30m]))"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_errors:ratio_rate30m
        expr: "1 - (sum by (node) (rate(electrum_rpc_bucket{job=\"electrs\", le=\"2.5\"}[30m]))) / (sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[30m])))"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_requests:rate1h
        expr: "sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[1h]))"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_errors:ratio_rate1h
        expr: "1 - (sum by (node) (rate(electrum_rpc_bucket{job=\"electrs\", le=\"2.5\"}[1h]))) / (sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[1h])))"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_requests:rate2h
        expr: "sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[2h]))"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_errors:ratio_rate2h
        expr: "1 - (sum by (node) (rate(electrum_rpc_bucket{job=\"electrs\", le=\"2.5\"}[2h]))) / (sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[2h])))"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_requests:rate6h
        expr: "sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[6h]))"
        labels:
          slo: electrum-latency
      - record: node:electrs_slo_errors:ratio_rate6h
        expr: "1 - (sum by (node) (rate(electrum_rpc_bucket{job=\"electrs\", le=\"2.5\"}[6h]))) / (sum by (node) (rate(electrum_rpc_count{job=\"electrs\"}[6h])))"
        labels:
