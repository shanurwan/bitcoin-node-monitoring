# Generated by scripts/generate.py. Edit SLOS there, not this file.
#
# Multi-window, multi-burn-rate alerts (Google SRE workbook). Each SLO records
#   node:electrs_slo_requests:rate<W>     requests per second
#   node:electrs_slo_errors:ratio_rate<W>  fraction of requests that were bad
# with an slo label, for the windows 5m, 30m, 1h, 2h, 6h, 1d, 3d.
groups:
  - name: electrs-slo.rules
    rules:
      - record: node:electrs_slo_requests:rate5m
        expr: "sum by (node) (rate(rest_request_duration_seconds_count{job=\"electrs\"}[5m]))"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_errors:ratio_rate5m
        expr: "1 - (sum by (node) (rate(rest_request_duration_seconds_count{job=\"electrs\", status!~\"5..\"}[5m]))) / (sum by (node) (rate(rest_request_duration_seconds_count{job=\"electrs\"}[5m])))"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_requests:rate30m
        expr: "sum by (node) (rate(rest_request_duration_seconds_count{job=\"electrs\"}[30m]))"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_errors:ratio_rate30m
        expr: "1 - (sum by (node) (rate(rest_request_duration_seconds_count{job=\"electrs\", status!~\"5..\"}[30m]))) / (sum by (node) (rate(rest_request_duration_seconds_count{job=\"electrs\"}[30m])))"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_requests:rate1h
        expr: "sum by (node) (rate(rest_request_duration_seconds_count{job=\"electrs\"}[1h]))"
        labels:
          slo: rest-availability
      - record: node:electrs_slo_errors:ratio_rate1h
